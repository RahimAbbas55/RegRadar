services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: regradar-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - regradar-net

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: regradar-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - regradar-net

networks:
  regradar-net:
    driver: bridge

volumes:
  qdrant_data: